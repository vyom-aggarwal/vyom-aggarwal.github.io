<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vyom Aggarwal">
  <!--
    The mark: VA set on the pixel grid the hero wordmark uses. The V
    leans, so its right arm stands straight and its left one steps down
    into the A. Two flat tones, not a gradient: the V in the signal
    blue, the A in the cyan the planet's limb uses.

    The blocks are 3.4 wide on a 3.4 horizontal pitch and a 4 vertical
    one, so a run of them closes into a solid bar across but stays
    striped down. That is what gives the mark its texture, and it is
    why the rects are not rounded.

    Built to survive small sizes: whole blocks, no strokes, nothing
    thinner than a block, and a dark tile so it reads on light and dark
    browser chrome alike.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0B0F14"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
  <g fill="#4A9EE0">
    <rect x="4" y="8" width="3.4" height="3.4"/>
    <rect x="4" y="12" width="3.4" height="3.4"/>
    <rect x="7.4" y="16" width="3.4" height="3.4"/>
    <rect x="10.8" y="20" width="3.4" height="3.4"/>
    <rect x="14.2" y="16" width="3.4" height="3.4"/>
    <rect x="14.2" y="12" width="3.4" height="3.4"/>
    <rect x="14.2" y="8" width="3.4" height="3.4"/>
  </g>
  <g fill="#8FE0F5">
    <rect x="21" y="8" width="3.4" height="3.4"/>
    <rect x="24.4" y="12" width="3.4" height="3.4"/>
    <rect x="17.6" y="12" width="3.4" height="3.4"/>
    <rect x="17.6" y="16" width="3.4" height="3.4"/>
    <rect x="21" y="16" width="3.4" height="3.4"/>
    <rect x="24.4" y="16" width="3.4" height="3.4"/>
    <rect x="17.6" y="20" width="3.4" height="3.4"/>
    <rect x="24.4" y="20" width="3.4" height="3.4"/>
  </g>
</svg>

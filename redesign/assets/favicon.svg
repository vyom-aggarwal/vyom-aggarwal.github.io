<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vyom Aggarwal">
  <!--
    The mark: a V lit the way every object on this site is lit — one
    cyan source from the upper left, one blue body. The facet where the
    light lands is the same --limb the planet's edge uses, so the logo
    and the scene share a light.

    Built to survive 16px: one closed shape, no strokes, no detail
    below two pixels, and a dark tile so it reads on light and dark
    browser chrome alike.
  -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57A8E6"/>
      <stop offset="1" stop-color="#3A80B8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="#0B0F14"/>
  <rect x=".5" y=".5" width="31" height="31" rx="7" fill="none" stroke="#fff" stroke-opacity=".10"/>

  <path d="M5.5 6.5 H10.8 L16 19.6 L21.2 6.5 H26.5 L17.9 26 H14.1 Z" fill="url(#v)"/>
  <path d="M5.5 6.5 H10.8 L13.1 12.3 H7.8 Z" fill="#8FE0F5"/>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Vyom Aggarwal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">

<style>
  /* One panel on the canvas, same as every other surface on the site. */
  .lost {
    min-height: calc(100svh - (var(--inset) * 2));
    display: grid; place-content: center; justify-items: start;
    gap: var(--s-4); padding: var(--gutter);
  }
  .lost__no {
    font-family: var(--font-mono); font-size: var(--fs-mono);
    letter-spacing: var(--track-wide); color: var(--ink-3);
  }
  .lost__no b { color: var(--signal); font-weight: 500; }
  .lost__code {
    font-size: clamp(3.4rem, 1rem + 9vw, 8rem);
    font-weight: var(--wt-display); line-height: 0.9;
    letter-spacing: var(--track-tight); color: var(--ink);
  }
  .lost__msg { color: var(--ink-2); max-width: 46ch; font-size: var(--fs-lede); }
  .lost__msg b { color: var(--ink); font-weight: 600; }
  .lost__cta { margin-top: var(--s-3); }
</style>
</head>

<body>
<div class="grain" aria-hidden="true"></div>

<main>
<div class="panel">
  <section class="lost">
    <p class="lost__no">[ <b>404</b> ]</p>
    <h1 class="lost__code">Nothing here.</h1>
    <p class="lost__msg">That URL doesn't resolve to anything on this site. It may have moved, or
      it may never have existed.</p>
    <a class="btn btn--solid lost__cta" href="/">Back to the portfolio</a>
  </section>
</div>
</main>
</body>
</html>
